include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - tool/out/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Unawaited futures in the reader (SystemChrome calls, scroll restores)
    # cause ordering bugs that are hard to see; make them fail the build.
    unawaited_futures: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - test_types_in_equals
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
