name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Goldens are rendered by this exact version; keep it in step with
      # tool/goldens/Dockerfile.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  # Release build, then the device tests on an Android emulator.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      # Without android/key.properties this is signed with the debug key:
      # it proves the release build, not a store upload.
      - run: flutter build apk --release

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Device runs take one file at a time. The storage, search and scroll
      # benchmarks need a real device (README). A run that fails or stalls
      # prints the emulator's Flutter and crash log.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            timeout 600 flutter test integration_test/app_test.dart || { adb logcat -d | grep -E "flutter|AndroidRuntime|FATAL|DEBUG|impeller|Impeller" | tail -150; exit 1; }
            timeout 600 flutter test integration_test/reader_rotation_test.dart || { adb logcat -d | grep -E "flutter|AndroidRuntime|FATAL|DEBUG|impeller|Impeller" | tail -150; exit 1; }
            timeout 600 flutter test integration_test/reader_polish_test.dart || { adb logcat -d | grep -E "flutter|AndroidRuntime|FATAL|DEBUG|impeller|Impeller" | tail -150; exit 1; }

  # Compiles the iOS app (including AppDelegate.swift), then the device
  # tests on an iPhone simulator.
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items()
                     if "iOS" in runtime for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$udid"
          # boot returns before the simulator is ready; a first test started
          # then times out connecting to the app's VM service.
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      # A first launch on a fresh simulator sometimes never connects (seen
      # in 2 of 3 runs): each test gets 15 minutes and one retry, and a
      # failure prints the app's simulator log. macOS has no `timeout`.
      - name: Device tests
        run: |
          device_test() {
            for attempt in 1 2; do
              perl -e 'alarm shift; exec @ARGV' 900                 flutter test "$1" -d "$SIMULATOR" && return 0
              echo "::warning::$1 attempt $attempt failed or stalled"
              xcrun simctl spawn "$SIMULATOR" log show --last 15m --style compact                 --predicate 'process == "Runner"' | tail -150 || true
            done
            return 1
          }
          device_test integration_test/app_test.dart
          device_test integration_test/reader_rotation_test.dart
          device_test integration_test/reader_polish_test.dart

